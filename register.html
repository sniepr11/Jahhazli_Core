<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جَهِّزلي | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { orange: '#FF6B00', gold: '#D4AF37' }, fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #050505; color: white; margin: 0; overflow: hidden; }
        .bg-cinematic { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-image: url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=2047&auto=format&fit=crop'); background-size: cover; background-position: center; transform: scale(1.05); animation: slowZoom 20s infinite alternate ease-in-out; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.95)); backdrop-filter: blur(5px); }
        .glass-premium { background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-top: 1px solid rgba(255,255,255,0.2); border-left: 1px solid rgba(255,255,255,0.2); box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slowZoom { from { transform: scale(1.05); } to { transform: scale(1.15); } }
        @keyframes glow { 0% { box-shadow: 0 0 15px rgba(255,107,0,0.3); } 50% { box-shadow: 0 0 30px rgba(255,107,0,0.6); } 100% { box-shadow: 0 0 15px rgba(255,107,0,0.3); } }
        .animate-fade-up { animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .glow-effect { animation: glow 3s infinite; }
        @keyframes shine { 100% { transform: translateX(200%) skewX(-15deg); } }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen relative">
    
    <div class="bg-cinematic"></div>
    <div class="bg-overlay"></div>
    <div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-orange/30 rounded-full blur-[150px] pointer-events-none"></div>

    <div class="glass-premium p-8 rounded-[2rem] z-10 w-full max-w-sm mx-4 animate-fade-up relative overflow-hidden">
        
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-orange/20 blur-[50px] pointer-events-none"></div>

        <div class="text-center mb-8 relative">
            <div class="w-28 h-28 mx-auto bg-black/50 border-2 border-orange/80 rounded-full flex items-center justify-center overflow-hidden mb-5 glow-effect relative">
                <div class="absolute inset-0 bg-gradient-to-tr from-orange/20 to-transparent"></div>
                <img src="logo.png" alt="جَهِّزلي" class="w-full h-full object-cover relative z-10 scale-110" onerror="this.outerHTML=`<span class='text-5xl relative z-10'>👑</span>`">
            </div>
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400 mb-1 tracking-tight">جَهِّزلي</h1>
            <p class="text-orange text-xs font-bold tracking-widest uppercase">VVIP B2B Platform</p>
        </div>

        <form id="registerForm" onsubmit="saveUser(event)" class="space-y-4 relative z-10">
            <div class="relative group">
                <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase tracking-wider">اسمك الكريم</label>
                <input type="text" id="customerName" required placeholder="مثال: سيف" class="w-full bg-black/40 border border-white/10 rounded-2xl px-5 py-3 text-white focus:border-orange outline-none transition-all focus:bg-black/60 focus:shadow-[0_0_20px_rgba(255,107,0,0.15)] group-hover:border-white/20">
            </div>
            <div class="relative group">
                <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase tracking-wider">اسم المطعم / الكافيه</label>
                <input type="text" id="shopName" required placeholder="مثال: مطعم العائلة" class="w-full bg-black/40 border border-white/10 rounded-2xl px-5 py-3 text-white focus:border-orange outline-none transition-all focus:bg-black/60 focus:shadow-[0_0_20px_rgba(255,107,0,0.15)] group-hover:border-white/20">
            </div>
            <div class="relative group">
                <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase tracking-wider">رقم الهاتف</label>
                <input type="tel" id="userPhone" required placeholder="07XXXXXXXXX" class="w-full bg-black/40 border border-white/10 rounded-2xl px-5 py-3 text-white focus:border-orange outline-none transition-all focus:bg-black/60 focus:shadow-[0_0_20px_rgba(255,107,0,0.15)] group-hover:border-white/20 text-left" dir="ltr">
            </div>
            <div class="relative group">
                <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase tracking-wider">عنوان التوصيل</label>
                <input type="text" id="userLocation" required placeholder="المنطقة، الشارع، أقرب نقطة دالة" class="w-full bg-black/40 border border-white/10 rounded-2xl px-5 py-3 text-white focus:border-orange outline-none transition-all focus:bg-black/60 focus:shadow-[0_0_20px_rgba(255,107,0,0.15)] group-hover:border-white/20">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-orange to-[#ff4500] text-white py-4 rounded-2xl font-black text-lg shadow-[0_10px_30px_rgba(255,107,0,0.4)] hover:shadow-[0_15px_40px_rgba(255,107,0,0.6)] transition-all transform hover:-translate-y-1 mt-6 relative overflow-hidden group">
                <span class="relative z-10 flex items-center justify-center gap-2">الدخول للمنيو <span class="text-2xl group-hover:translate-x-[-5px] transition-transform">🚀</span></span>
                <div class="absolute inset-0 bg-white/20 translate-x-[-100%] skew-x-[-15deg] group-hover:animate-[shine_1s_ease-out]"></div>
            </button>
        </form>
    </div>

    <div class="mt-8 text-center animate-fade-up" style="animation-delay: 0.3s;">
        <p class="text-gray-500 text-[10px] font-bold tracking-widest uppercase shadow-black drop-shadow-md">Powered by Jahhazli Enterprise</p>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem('user_phone') && localStorage.getItem('shop_name')) {
                window.location.href = 'dashboard.html';
            }
        };

        function saveUser(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = `<span class="relative z-10 flex items-center justify-center gap-2">جاري التجهيز... ⏳</span>`;
            btn.style.opacity = '0.8';
            btn.style.transform = 'scale(0.98)';
            
            setTimeout(() => {
                localStorage.setItem('customer_name', document.getElementById('customerName').value);
                localStorage.setItem('shop_name', document.getElementById('shopName').value);
                localStorage.setItem('user_phone', document.getElementById('userPhone').value);
                localStorage.setItem('user_location', document.getElementById('userLocation').value);
                window.location.href = 'dashboard.html';
            }, 800);
        }
    </script>
</body>
</html>
