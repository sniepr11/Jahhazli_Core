<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <!-- هذا السطر اللي نسيته وهو اللي يصلح الحجم الصغير -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>لوحة الإدارة | جَهِّزلي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { navyDark: '#070C15', orange: '#FF6B00', gold: '#D4AF37' }, fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }</script>
    <style>body{font-family:'Cairo',sans-serif;background-color:#070C15;color:white;} .glass-panel{background:rgba(255,255,255,0.03);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.05);} .no-scrollbar::-webkit-scrollbar{display:none;}</style>
</head>
<body class="flex flex-col h-screen overflow-hidden relative">
    
    <header class="glass-panel p-4 flex justify-between items-center z-10 border-b border-white/10 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full overflow-hidden shadow-[0_0_15px_rgba(255,107,0,0.3)] border border-orange/30 bg-navyDark flex items-center justify-center text-xl">👑</div>
            <div><h1 class="font-black text-lg text-white leading-none">لوحة الإدارة</h1><p id="adminNameDisplay" class="text-xs text-orange font-bold mt-1"></p></div>
        </div>
    </header>

    <main class="flex-1 flex flex-col h-full relative overflow-hidden pb-24">
        <!-- الطلبات -->
        <section id="ordersSection" class="flex-1 p-6 overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-black text-white">الطلبات 📋</h2><button onclick="loadOrders()" class="bg-white/10 px-4 py-2 rounded-xl text-sm font-bold hover:bg-orange transition">🔄 تحديث</button></div>
            <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <!-- المنتجات -->
        <section id="productsSection" class="flex-1 p-6 overflow-y-auto no-scrollbar hidden">
            <h2 class="text-2xl font-black text-white mb-6">المنتجات 📦</h2>
            <div class="glass-panel p-6 rounded-2xl border-t-2 border-orange mb-8 shadow-xl">
                <form id="addProductForm" onsubmit="addProduct(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <input type="text" id="pName" placeholder="الاسم" required class="bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white outline-none">
                    <input list="categoryList" id="pCat" placeholder="الصنف" required class="bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white outline-none">
                    <datalist id="categoryList"></datalist>
                    <input type="number" id="pPrice" placeholder="السعر" required class="bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white outline-none">
                    <input type="file" id="pImageFile" required class="bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white outline-none w-full">
                    <button type="submit" class="md:col-span-4 bg-orange text-navyDark py-3 rounded-xl font-black transition shadow-lg">إضافة للمنيو</button>
                </form>
            </div>
            <div id="adminProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4"></div>
        </section>

        <!-- الجرد -->
        <section id="ledgerSection" class="flex-1 p-6 overflow-y-auto no-scrollbar hidden">
            <h2 class="text-2xl font-black text-white mb-6">جرد المطاعم 📊</h2>
            <div id="ledgerGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>
        
        <!-- تفاصيل المطعم (للجرد) -->
        <section id="shopDetailsSection" class="flex-1 p-6 overflow-y-auto no-scrollbar hidden absolute inset-0 bg-navyDark z-20">
            <button onclick="closeShopDetails()" class="mb-4 bg-white/10 px-4 py-2 rounded-xl text-sm font-bold">🔙 رجوع</button>
            <h2 id="shopDetailsTitle" class="text-2xl font-black text-orange mb-2"></h2>
            <p id="shopDetailsTotal" class="text-gray-400 mb-6 font-bold"></p>
            <div id="shopOrdersGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 pb-20"></div>
        </section>

        <!-- الإحصائيات -->
        <section id="statsSection" class="flex-1 p-6 overflow-y-auto no-scrollbar hidden">
            <div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-black text-white">الإحصائيات 📈</h2><button onclick="loadStats()" class="bg-white/10 px-4 py-2 rounded-xl text-sm font-bold hover:bg-orange transition">🔄 تحديث</button></div>
            <div id="statsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8"></div>
            <h3 class="text-xl font-bold text-gray-300 mb-4">سجل النشاطات</h3>
            <div id="logsGrid" class="space-y-3 pb-20"></div>
        </section>

        <!-- الموظفين (للمدير العام فقط) -->
        <section id="staffSection" class="flex-1 p-6 overflow-y-auto no-scrollbar hidden">
            <h2 class="text-2xl font-black text-white mb-6">إدارة الموظفين 👨‍💼</h2>
            <div class="glass-panel p-6 rounded-2xl border-t-2 border-red-500 mb-8 shadow-xl">
                <form id="addStaffForm" onsubmit="addStaff(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="sName" placeholder="اسم الموظف (مثال: علي)" required class="bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white outline-none w-full">
                    <input type="text" id="sPin" placeholder="الرمز السري (الرقم السري للموظف)" required class="bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white outline-none w-full">
                    <button type="submit" class="bg-red-500 text-white py-3 rounded-xl font-black transition shadow-lg w-full">إنشاء حساب ➕</button>
                </form>
            </div>
            <div id="staffGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass-panel border-t border-white/10 flex justify-start sm:justify-around p-3 z-40 bg-navyDark/95 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] overflow-x-auto no-scrollbar gap-6 sm:gap-2">
        <button onclick="switchTab('orders')" id="tab-orders" class="text-orange font-bold text-xs flex flex-col items-center transition-all transform scale-110 shrink-0"><span class="text-xl">📋</span>الطلبات</button>
        <button onclick="switchTab('products')" id="tab-products" class="text-gray-400 font-bold text-xs flex flex-col items-center transition-all shrink-0"><span class="text-xl">📦</span>المنتجات</button>
        <button onclick="switchTab('ledger')" id="tab-ledger" class="text-gray-400 font-bold text-xs flex flex-col items-center transition-all shrink-0"><span class="text-xl">📊</span>الجرد</button>
        <button onclick="switchTab('stats')" id="tab-stats" class="text-gray-400 font-bold text-xs flex flex-col items-center transition-all shrink-0"><span class="text-xl">📈</span>إحصاء</button>
        <button onclick="switchTab('staff')" id="tab-staff" class="hidden text-gray-400 font-bold text-xs flex flex-col items-center transition-all shrink-0"><span class="text-xl">👨‍💼</span>الموظفين</button>
        <button onclick="logoutAdmin()" class="text-red-500 font-bold text-xs flex flex-col items-center transition-all shrink-0 ml-auto sm:ml-0"><span class="text-xl">🚪</span>خروج</button>
    </nav>
    <div id="copyToast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-2 rounded-full font-bold z-[110] transition-all opacity-0 pointer-events-none translate-y-[-20px]">تم نسخ الوصل ✓</div>

    <script>
        // هنا تم التحديث للرابط الجديد الخاص بسيرفر Render
        const API_URL = "https://jahhazli-core.onrender.com";
        let allAdminOrders = [];
        let activeAdmin = localStorage.getItem('active_admin');
        let isMaster = localStorage.getItem('is_master') === 'true';

        window.onload = function() {
            if(!activeAdmin) { logoutAdmin(); return; }
            document.getElementById('adminNameDisplay').innerText = `حساب: ${activeAdmin}`;
            
            // هنا الكود اللي يظهر زر الموظفين للمدير العام فقط
            if(isMaster) {
                document.getElementById('tab-staff').classList.remove('hidden');
            }
            
            loadOrders();
        };

        // نظام الطرد الأوتوماتيكي
        setInterval(async () => {
            try {
                const res = await fetch(`${API_URL}/admins/`); const admins = await res.json();
                if(!admins.find(a => a.name === activeAdmin)) logoutAdmin();
            } catch(e){}
        }, 5000);

        function switchTab(tab) {
            ['products', 'orders', 'ledger', 'stats', 'shopDetails', 'staff'].forEach(t => {
                const sec = document.getElementById(`${t}Section`); if(sec) sec.classList.add('hidden');
                const btn = document.getElementById(`tab-${t}`); if(btn) { btn.classList.remove('text-orange', 'scale-110'); btn.classList.add('text-gray-400'); }
            });
            document.getElementById(`tab-${tab}`).classList.add('text-orange', 'scale-110');
            document.getElementById(`tab-${tab}`).classList.remove('text-gray-400');
            document.getElementById(`${tab}Section`).classList.remove('hidden');

            if(tab === 'products') loadProducts();
            else if(tab === 'orders') loadOrders();
            else if(tab === 'ledger') loadLedger();
            else if(tab === 'stats') loadStats();
            else if(tab === 'staff' && isMaster) loadStaff();
        }

        function logoutAdmin() { 
            localStorage.removeItem('active_admin'); 
            localStorage.removeItem('is_master'); 
            window.location.href = 'admin-login.html'; 
        }

        // --- الموظفين (Super Admin) ---
        async function loadStaff() {
            try {
                const res = await fetch(`${API_URL}/admins/`); const admins = await res.json();
                const grid = document.getElementById('staffGrid'); grid.innerHTML = '';
                admins.forEach(a => {
                    const deleteBtn = a.is_master ? `<span class="text-green-500 font-bold text-xs bg-green-500/20 px-2 py-1 rounded">المدير العام (لا يحذف)</span>` 
                                                  : `<button onclick="deleteStaff(${a.id})" class="bg-red-500/20 text-red-500 hover:bg-red-500 hover:text-white px-3 py-1 rounded text-xs font-bold transition">حذف وطرد 🗑️</button>`;
                    grid.innerHTML += `
                        <div class="glass-panel p-4 rounded-xl flex justify-between items-center">
                            <div><h4 class="font-bold text-white">${a.name}</h4><p class="text-xs text-gray-400">الرمز: ${a.pin}</p></div>
                            ${deleteBtn}
                        </div>`;
                });
            } catch(e){}
        }
        
        async function addStaff(e) {
            e.preventDefault();
            const data = { name: document.getElementById('sName').value, pin: document.getElementById('sPin').value, is_master: false };
            try {
                const res = await fetch(`${API_URL}/admins/`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
                if(res.ok) { document.getElementById('addStaffForm').reset(); loadStaff(); }
                else alert("الاسم موجود مسبقاً!");
            } catch(e){}
        }
        
        async function deleteStaff(id) {
            if(confirm("سيتم حذف حساب الموظف وطرده فوراً، هل أنت متأكد؟")) {
                await fetch(`${API_URL}/admins/${id}`, { method: 'DELETE' }); loadStaff();
            }
        }

        // --- الطلبات ---
        async function loadOrders() {
            try {
                const res = await fetch(`${API_URL}/orders/`); allAdminOrders = await res.json();
                const grid = document.getElementById('ordersGrid');
                if(allAdminOrders.length === 0) { grid.innerHTML = '<p class="text-center text-gray-400 mt-5">لا توجد طلبات.</p>'; return; }
                grid.innerHTML = '';
                allAdminOrders.forEach(order => {
                    let items = []; try { items = JSON.parse(order.items); } catch(e) {}
                    let itemsHtml = items.map(i => `<li class="text-sm bg-black/40 px-2 py-1 rounded mb-1">${i.qty}x ${i.name}</li>`).join('');

                    let statusHtml = '';
                    if (order.status === 'مكتمل') statusHtml = `<span class="bg-green-500/20 text-green-500 border border-green-500/50 rounded px-2 py-1 text-xs font-bold">مكتمل ✅ (مقفول)</span>`;
                    else if (order.status === 'ملغي') statusHtml = `<span class="bg-red-500/20 text-red-500 border border-red-500/50 rounded px-2 py-1 text-xs font-bold">ملغي ❌ (مقفول)</span>`;
                    else {
                        let opts = order.status === 'قيد التحضير' ? '<option value="قيد التحضير" selected>قيد التحضير ⏳</option><option value="مكتمل">مكتمل ✅</option><option value="ملغي">ملغي ❌</option>' 
                                 : '<option value="جديد" selected>جديد 🟠</option><option value="قيد التحضير">قيد التحضير ⏳</option><option value="مكتمل">مكتمل ✅</option><option value="ملغي">ملغي ❌</option>';
                        statusHtml = `<select onchange="updateOrderStatus(${order.id}, this.value)" class="bg-blue-500/20 text-blue-400 text-xs border border-blue-500/50 rounded p-1 font-bold outline-none">${opts}</select>`;
                    }

                    grid.innerHTML += `
                        <div class="glass-panel p-5 rounded-2xl border-t-4 ${order.status==='جديد'?'border-orange':order.status==='مكتمل'?'border-green-500':'border-blue-500'}">
                            <div class="flex justify-between mb-3"><span class="font-black text-white">طلب #${order.id}</span>${statusHtml}</div>
                            <div class="text-sm text-gray-300 mb-3"><p>🏪 ${order.shop_name}</p><p>📞 ${order.phone}</p><p>📍 ${order.location}</p></div>
                            <ul class="bg-black/30 p-2 rounded mb-3">${itemsHtml}</ul>
                            <div class="flex justify-between items-end">
                                <span class="text-gold font-black text-lg">${order.total.toLocaleString()} د.ع</span>
                                <button onclick="copyReceipt(${order.id})" class="bg-white/10 px-3 py-1 rounded text-xs font-bold">نسخ الوصل 📄</button>
                            </div>
                        </div>`;
                });
            } catch (error) {}
        }

        async function updateOrderStatus(orderId, newStatus) {
            try { await fetch(`${API_URL}/orders/${orderId}/status?admin_name=${activeAdmin}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({status:newStatus}) }); loadOrders(); } catch(e){}
        }

        function copyReceipt(orderId) {
            const order = allAdminOrders.find(o => o.id === orderId); if(!order) return;
            let items = []; try { items = JSON.parse(order.items); } catch(e) {}
            let itemsText = items.map((i, idx) => `${idx+1}. ${i.name}(العدد: 
${i.qty})`).join('\n\n');
            let txt = `🧾 وصل طلب جديد - جَهِّزلي 🧾\n=======================\n🏪 المطعم: ${order.shop_name}\n📍 العنوان: ${order.location} | 📞 ${order.phone}\n=======================\n📦 تفاصيل المنتجات:\n${itemsText}\n=======================\n💰 الإجمالي: ${order.total.toLocaleString()} د.ع\n🕒 الوقت: ${order.date}`;
            navigator.clipboard.writeText(txt).then(() => {
                const toast = document.getElementById('copyToast'); toast.classList.remove('opacity-0', 'translate-y-[-20px]');
                setTimeout(() => toast.classList.add('opacity-0', 'translate-y-[-20px]'), 2000);
            });
        }

        // --- الجرد ---
        async function loadLedger() {
            if(allAdminOrders.length===0) { const res=await fetch(`${API_URL}/orders/`); allAdminOrders=await res.json(); }
            const shops = {};
            allAdminOrders.forEach(o => {
                if(o.status === 'ملغي') return;
                if(!shops[o.shop_name]) shops[o.shop_name]={phone:o.phone, total:0, count:0, orders:[]};
                shops[o.shop_name].total += o.total; shops[o.shop_name].count += 1; shops[o.shop_name].orders.push(o);
            });
            const grid = document.getElementById('ledgerGrid'); grid.innerHTML = '';
            for (const [name, data] of Object.entries(shops)) {
                grid.innerHTML += `<div class="glass-panel p-5 rounded-xl border-r-4 border-orange">
                    <h3 class="font-black text-lg mb-2">${name} <span class="text-xs text-gray-400">(${data.phone})</span></h3>
                    <p class="text-gray-300 text-sm mb-4">الطلبات: ${data.count} | الإجمالي: <span class="text-gold font-bold">${data.total.toLocaleString()} د.ع</span></p>
                    <button onclick="openShopDetails('${name}')" class="w-full bg-white/10 py-2 rounded font-bold">التفاصيل</button>
                </div>`;
            }
        }
        
        function openShopDetails(name) { 
            const shopOrders = allAdminOrders.filter(o => o.shop_name === name && o.status !== 'ملغي');
            const total = shopOrders.reduce((sum, o) => sum + o.total, 0);
            
            document.getElementById('shopDetailsTitle').innerText = `جرد: ${name}`;
            document.getElementById('shopDetailsTotal').innerText = `إجمالي المبالغ: ${total.toLocaleString()} د.ع (${shopOrders.length} طلبات)`;
            
            const grid = document.getElementById('shopOrdersGrid');
            grid.innerHTML = shopOrders.map(order => {
                let items = []; try { items = JSON.parse(order.items); } catch(e) {}
                let itemsHtml = items.map(i => `<span class="text-xs bg-white/5 px-2 py-1 rounded border border-white/10 m-1 inline-block">${i.qty}x ${i.name}</span>`).join('');
                return `
                    <div class="bg-black/30 p-4 rounded-2xl border border-white/5">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-white">طلب #${order.id}</span>
                            <span class="text-xs text-green-500 font-bold">${order.date}</span>
                        </div>
                        <div class="mb-3">${itemsHtml}</div>
                        <p class="text-gold font-black text-left">${order.total.toLocaleString()} د.ع</p>
                    </div>
                `;
            }).join('');

            document.getElementById('ledgerSection').classList.add('hidden');
            document.getElementById('shopDetailsSection').classList.remove('hidden');
        }
        
        function closeShopDetails() { document.getElementById('shopDetailsSection').classList.add('hidden'); document.getElementById('ledgerSection').classList.remove('hidden'); }

        // --- المنتجات ---
        async function loadProducts() {
            try {
                const res = await fetch(`${API_URL}/products/`); const products = await res.json();
                document.getElementById('categoryList').innerHTML = [...new Set(products.map(p=>p.category))].map(c=>`<option value="${c}">`).join('');
                const grid = document.getElementById('adminProductsGrid'); grid.innerHTML='';
                products.forEach(p => {
                    const isAvail = p.available !== false; const opacity = isAvail?'':'opacity-50 grayscale';
                    grid.innerHTML += `
                        <div class="glass-panel p-3 rounded-xl ${opacity}">
                            <img src="${p.img}" class="w-full h-24 object-cover rounded mb-2">
                            <h3 class="font-bold text-sm">${p.name}</h3><p class="text-gold text-sm font-black mb-2">${p.price.toLocaleString()} د.ع</p>
                            <div class="grid grid-cols-2 gap-1 text-xs">
                                <button onclick="editPrice(${p.id}, ${p.price})" class="bg-blue-500/20 text-blue-400 py-1 rounded">تعديل</button>
                                <button onclick="toggleAvailability(${p.id}, ${isAvail})" class="${isAvail?'bg-orange/20 text-orange':'bg-green-500/20 text-green-500'} py-1 rounded">${isAvail?'إيقاف':'تفعيل'}</button>
                                <button onclick="deleteProduct(${p.id})" class="col-span-2 bg-red-500/20 text-red-500 py-1 rounded">حذف</button>
                            </div>
                        </div>`;
                });
            } catch(e){}
        }
        
        async function addProduct(e) { e.preventDefault(); const fd=new FormData(); fd.append("name",document.getElementById('pName').value); fd.append("category",document.getElementById('pCat').value); fd.append("price",document.getElementById('pPrice').value); fd.append("file",document.getElementById('pImageFile').files[0]); fd.append("admin_name", activeAdmin);
            await fetch(`${API_URL}/products/`, {method:'POST', body:fd}); loadProducts();
        }
        async function editPrice(id, oldP) { const nP=prompt("سعر جديد:", oldP); if(nP) { await fetch(`${API_URL}/products/${id}/price?new_price=${nP}&admin_name=${activeAdmin}`, {method:'PUT'}); loadProducts(); } }
        async function toggleAvailability(id, st) { await fetch(`${API_URL}/products/${id}/availability?available=${!st}&admin_name=${activeAdmin}`, {method:'PUT'}); loadProducts(); }
        async function deleteProduct(id) { if(confirm('متأكد؟')){ await fetch(`${API_URL}/products/${id}?admin_name=${activeAdmin}`, {method:'DELETE'}); loadProducts(); } }

        // --- الإحصائيات (المراقبة VVIP) ---
        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/logs/`);
                const logs = await res.json();
                
                const stats = {};
                logs.forEach(log => {
                    if(!stats[log.admin_name]) stats[log.admin_name] = { processing:0, prices:0, others:0 };
                    if(log.action_type === 'معالجة طلب') stats[log.admin_name].processing++;
                    else if(log.action_type === 'تعديل سعر') stats[log.admin_name].prices++;
                    else stats[log.admin_name].others++;
                });

                const grid = document.getElementById('statsGrid'); grid.innerHTML = '';
                for (const [name, data] of Object.entries(stats)) {
                    grid.innerHTML += `
                        <div class="glass-panel p-5 rounded-2xl border-t-4 border-blue-500">
                            <h3 class="font-black text-xl mb-3 text-white">👨‍💼 ${name}</h3>
                            <div class="space-y-2 text-sm">
                                <div class="flex justify-between"><span class="text-gray-400">معالجة طلبات:</span><span class="font-bold text-green-400">${data.processing} إجراء</span></div>
                                <div class="flex justify-between"><span class="text-gray-400">تعديل أسعار:</span><span class="font-bold text-gold">${data.prices} إجراء</span></div>
                                <div class="flex justify-between"><span class="text-gray-400">عمليات أخرى:</span><span class="font-bold text-orange">${data.others} إجراء</span></div>
                            </div>
                        </div>`;
                }

                const logsGrid = document.getElementById('logsGrid'); logsGrid.innerHTML = '';
                logs.slice(0, 20).forEach(log => {
                    logsGrid.innerHTML += `
                        <div class="bg-black/40 p-3 rounded-xl border border-white/5 flex flex-col md:flex-row justify-between md:items-center gap-2">
                            <div>
                                <span class="text-xs bg-white/10 px-2 py-1 rounded text-gray-300 font-bold">${log.admin_name}</span>
                                <span class="text-orange font-bold text-sm mx-2">${log.action_type}</span>
                                <span class="text-gray-300 text-sm">${log.description}</span>
                            </div>
                            <span class="text-xs text-gray-500">${log.date}</span>
                        </div>`;
                });
            } catch(e){}
        }
    </script>
</body>
</html>
